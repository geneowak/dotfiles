font_size 17
adjust_line_height 180%

cursor_blink_interval 0
enable_audio_bell 0
# hide_window_decorations yes
# title-bar-only yes
# titlebar-and-corners yes
window_padding_width 3

map cmd+c           copy_to_clipboard
map cmd+v           paste_from_clipboard
map shift+insert    paste_from_clipboard

# Ability to map ctrl + tab (https://www.reddit.com/r/neovim/comments/uc6q8h/ability_to_map_ctrl_tab_and_more/)
map  ctrl+enter      send_text normal,application \x1b[13;5u
map  shift+enter     send_text normal,application \x1b[13;2u
map  ctrl+tab        send_text normal,application \x1b[9;5u
map  ctrl+shift+tab  send_text normal,application \x1b[9;6u

# BEGIN_KITTY_THEME
include Material Dark.conf

# Match the tab bar background to the Material Darker background
# 1. Tab Bar Look & Feel
tab_bar_style        separator
tab_separator        " │ "
tab_bar_edge         bottom
tab_bar_min_tabs     1

# 2. Material Darker Colors for Tabs (Matches #212121 Background)
tab_bar_background      #212121
active_tab_background   #212121
active_tab_foreground   #EEFFFF
active_tab_font_style   bold
inactive_tab_background #212121
inactive_tab_foreground #616161
inactive_tab_font_style normal

# 3. Clean Window Borders (Blends completely into the backdrop)
active_border_color     #212121
inactive_border_color   #212121
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="VictorMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
